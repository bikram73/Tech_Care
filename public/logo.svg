<svg width="215" height="44" viewBox="0 0 215 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Green Wing Gradient -->
    <linearGradient id="logo-top-green" x1="11.5" y1="2" x2="21.5" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D284"/>
      <stop offset="100%" stop-color="#01F0D0"/>
    </linearGradient>
    
    <!-- Right Bright Cyan Wing Gradient -->
    <linearGradient id="logo-right-cyan" x1="21.5" y1="10" x2="35.5" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#01F0D0"/>
      <stop offset="100%" stop-color="#00D7BD"/>
    </linearGradient>
    
    <!-- Left Translucent Ice Blue Gradient -->
    <linearGradient id="logo-left-ice" x1="0" y1="16" x2="21.5" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#8AD3F5"/>
    </linearGradient>

    <!-- Bottom Royal Blue Wing Gradient -->
    <linearGradient id="logo-bottom-blue" x1="11.5" y1="22" x2="21.5" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#00438E"/>
    </linearGradient>
  </defs>

  <!-- Faceted 4-Wing Medical Cross Mark -->
  <g transform="translate(2, 1)">
    <!-- Left Ice Blue Wing (Faceted underlay) -->
    <path d="M0 16.5L11.5 10L21.5 19.5L10 26L0 16.5Z" fill="url(#logo-left-ice)" fill-opacity="0.88"/>
    
    <!-- Top Green Wing -->
    <path d="M11.5 2L21.5 10.5V22H11.5V2Z" fill="url(#logo-top-green)"/>
    
    <!-- Right Cyan Wing -->
    <path d="M21.5 10.5L35.5 18.5L24.5 27.5L21.5 22V10.5Z" fill="url(#logo-right-cyan)"/>
    
    <!-- Bottom Royal Blue Wing -->
    <path d="M11.5 22H21.5V31.5L11.5 41V22Z" fill="url(#logo-bottom-blue)"/>
  </g>

  <!-- Typography: Tech.Care -->
  <text x="46" y="32" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.03em" fill="#072635">
    Tech<tspan fill="#01F0D0">.</tspan>Care
  </text>
</svg>
